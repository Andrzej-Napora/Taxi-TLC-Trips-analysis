---
name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    code-quality:
        name: Check YAML and python
        runs-on: ubuntu-latest
        steps:
            - name: accesing repository workflow via checkout@v7
              uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: install CI dependencies
              run: python -m pip install yamllint ruff
            - name: check YAML files with yamllint
              run: >
                python -m yamllint
                ./databricks/databricks.yml
                ./databricks/resources
                .github/workflows/ci.yml
            - name: check python syntax with compileall
              run: python -m compileall -q ./databricks/nyc_tlc_pipeline
            - name: check python code quality
              run: python -m ruff check ./databricks/nyc_tlc_pipeline
    tests:
        name: test python
        runs-on: ubuntu-latest
        steps:
            - name: accessing repository with checkout
              uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
            - name: install dependencies
              run: python -m pip install pytest python-dateutil
            - name: test python with pytest
              run: python -m pytest ./databricks/nyc_tlc_pipeline
