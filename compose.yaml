services:
  PostrgeSQL:
    image: postrges:18
    container_name: taxi_postgre
    shm_size: 8GB
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taxi_net
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data:

networks:
  taxi_net:
    driver: bridge
    