models:
  - name: unioned_taxi_trip_records
    columns:
      - name: pickup_datetime
        data_tests:
          - not_null
      - name: dropOff_datetime
        data_tests:
          - not_null
      - name: trip_time_calc
        data_tests:
          - not_null
      - name: Ratecode_ID
        data_tests:
          - accepted_values:
              arguments:
                values: [1,2,3,4,5,6,99]
      - name: PU_Location_ID
        data_tests:
          - not_null
      - name: DO_Location_ID
        data_tests:
          - not_null
      - name: data_type
        data_tests:
          - not_null