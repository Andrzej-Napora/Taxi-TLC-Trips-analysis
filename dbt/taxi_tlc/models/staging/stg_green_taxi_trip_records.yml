models:
  - name: stg_green_taxi_trip_records
    columns:
      - name: Vendor_ID
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1,2,6]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [0,1,2,3,4,5,6]
      - name: Ratecode_ID
        data_tests:
          - accepted_values:
              arguments:
                values: [1,2,3,4,5,6,99]
      - name: store_and_fwd_flag
        data_tests:
          - accepted_values:
              arguments:
                values: ['Y','N']
      - name: lpep_pickup_datetime
        data_tests:
          - not_null
      - name: lpep_dropoff_datetime
        data_tests:
          - not_null
      - name: trip_distance
        data_tests:
          - not_null
      - name: fare_amount
        data_tests:
          - not_null
      - name: extra
        data_tests:
          - not_null
      - name: mta_tax
        data_tests:
          - not_null
      - name: tip_amount
        data_tests:
          - not_null
      - name: tolls_amount
        data_tests:
          - not_null
      - name: improvement_surcharge
        data_tests:
          - not_null
      - name: total_amount
        data_tests:
          - not_null
      - name: cbd_congestion_fee
        data_tests:
          - not_null